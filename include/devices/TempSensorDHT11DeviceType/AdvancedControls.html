<style>
  .sensor-history { width:100%; min-width:0; color:#E7ECF3; text-align:left; }
  .sensor-history header { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:12px; }
  .sensor-history h3 { font-size:16px; line-height:1.25; margin:0; }
  .sensor-history .period { color:#98A6B8; font-size:11px; white-space:nowrap; }
  .sensor-history .summary { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-bottom:12px; }
  .sensor-history .extremes { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-bottom:12px; }
  .sensor-history .extreme { min-width:0; padding:8px 9px; background:#1D232B; border:1px solid #3B4654; border-radius:5px; }
  .sensor-history .extreme strong { display:block; font-size:14px; line-height:1.2; }
  .sensor-history .extreme span { display:block; margin-top:3px; color:#98A6B8; font-size:10px; line-height:1.25; }
  .sensor-history .metric { min-width:0; border-top:2px solid #FF796B; padding:8px 9px; background:#1D232B; border-radius:5px; }
  .sensor-history .metric.humidity { border-color:#45B9DE; }
  .sensor-history .metric strong { display:block; font-size:18px; line-height:1.2; }
  .sensor-history .metric span { display:block; margin-top:3px; color:#98A6B8; font-size:10px; line-height:1.25; }
  .sensor-history .chart { margin:0 0 10px; }
  .sensor-history .chart:last-child { margin-bottom:0; }
  .sensor-history .chart-title { display:flex; justify-content:space-between; gap:8px; margin-bottom:4px; color:#C5CEDA; font-size:11px; font-weight:600; }
  .sensor-history .chart-title span:last-child { color:#7F8C9D; font-weight:400; text-align:right; }
  .sensor-history canvas { box-sizing:border-box; width:100%; height:120px; display:block; background:#1D232B; border:1px solid #3B4654; border-radius:5px; }
  .sensor-history .empty { padding:24px 12px; text-align:center; color:#AAB5C3; background:#1D232B; border:1px solid #3B4654; border-radius:5px; }
  @media (max-width:380px) { .sensor-history header { align-items:flex-start; flex-direction:column; } .sensor-history .summary { grid-template-columns:1fr; } }
</style>
<div class="sensor-history" data-role="sensor-history">
  <header><h3>Seven-day climate trend</h3><span class="period" data-role="period"></span></header>
  <div data-role="content"></div>
</div>
<script type="application/x-hcs-advanced-controls">
const bytes = Uint8Array.from(context.payload);
const view = new DataView(bytes.buffer);
const content = context.root.querySelector('[data-role="content"]');
const period = context.root.querySelector('[data-role="period"]');
const magic = bytes.length >= 376 ? view.getUint32(0, true) : 0;
if (magic !== 0x54485331 || bytes[4] !== 3) {
  context.showError('Temperature history is unavailable or has an unsupported format.');
  return;
}

const records = [];
for (let index = 0; index < 14; index += 1) {
  const offset = 40 + index * 24;
  const valid = bytes[offset + 5] !== 0;
  const samples = view.getUint16(offset + 6, true);
  if (!valid || samples === 0) continue;
  const year = view.getUint16(offset, true);
  const day = view.getUint16(offset + 2, true);
  if (year < 2000 || year > 2200 || day > 366) continue;
  records.push({
    year, day, samples,
    date: new Date(year, 0, day + 1),
    tempSum: view.getFloat32(offset + 8, true),
    tempMin: view.getInt16(offset + 12, true) / 100,
    tempMax: view.getInt16(offset + 14, true) / 100,
    humidSum: view.getUint32(offset + 16, true),
    humidMin: bytes[offset + 20],
    humidMax: bytes[offset + 21]
  });
}

const readExtreme = (offset, value, suffix, decimals) => {
  const year = view.getUint16(offset, true);
  if (year < 2000) return null;
  const day = view.getUint16(offset + 2, true);
  const date = new Date(year, 0, day + 1, bytes[offset + 4], bytes[offset + 5]);
  return { value, suffix, date, decimals };
};
const extrema = [
  ['Lowest temperature', readExtreme(8, view.getInt16(14, true) / 100, '&deg;C', 1)],
  ['Highest temperature', readExtreme(16, view.getInt16(22, true) / 100, '&deg;C', 1)],
  ['Lowest humidity', readExtreme(24, bytes[30], '%', 0)],
  ['Highest humidity', readExtreme(32, bytes[38], '%', 0)]
];

const byDay = new Map();
records.forEach(record => {
  const key = `${record.year}-${record.day}`;
  const day = byDay.get(key) || { date: record.date, samples: 0, tempSum: 0, tempMin: Infinity, tempMax: -Infinity, humidSum: 0, humidMin: 101, humidMax: 0 };
  day.samples += record.samples;
  day.tempSum += record.tempSum;
  day.tempMin = Math.min(day.tempMin, record.tempMin);
  day.tempMax = Math.max(day.tempMax, record.tempMax);
  day.humidSum += record.humidSum;
  day.humidMin = Math.min(day.humidMin, record.humidMin);
  day.humidMax = Math.max(day.humidMax, record.humidMax);
  byDay.set(key, day);
});
const days = Array.from(byDay.values()).sort((left, right) => left.date - right.date).slice(-7);
days.forEach(day => { day.tempAvg = day.tempSum / day.samples; day.humidAvg = day.humidSum / day.samples; });
const formatDay = date => date.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric' });
period.textContent = days.length > 1 ? `${formatDay(days[0].date)} - ${formatDay(days[days.length - 1].date)}` : `${days.length} day collected`;
const latest = days[days.length - 1];
const previous = days[days.length - 2] || latest;
const signed = value => `${value >= 0 ? '+' : ''}${value.toFixed(1)}`;
const formatExtremeDate = date => date.toLocaleString(undefined, { dateStyle: 'short', timeStyle: 'short' });
const extremeMarkup = extrema.map(([label, item]) => item ? `<div class="extreme"><strong>${item.value.toFixed(item.decimals)}${item.suffix}</strong><span>${label}<br>${formatExtremeDate(item.date)}</span></div>` : '').join('');
content.innerHTML = `${extremeMarkup ? `<div class="extremes">${extremeMarkup}</div>` : ''}<div class="summary"><div class="metric"><strong>${latest ? latest.tempAvg.toFixed(1) : '--'}&deg;C</strong><span>${days.length > 1 ? `${signed(latest.tempAvg - previous.tempAvg)}&deg;C from previous day` : 'Current average'}</span></div><div class="metric humidity"><strong>${latest ? latest.humidAvg.toFixed(0) : '--'}%</strong><span>${days.length > 1 ? `${signed(latest.humidAvg - previous.humidAvg)}% from previous day` : 'Current average'}</span></div></div>${days.length > 1 ? '<div class="chart"><div class="chart-title"><span>Seven-day temperature</span><span>daily min / average / max</span></div><canvas data-chart="temperature"></canvas></div><div class="chart"><div class="chart-title"><span>Seven-day humidity</span><span>daily min / average / max</span></div><canvas data-chart="humidity"></canvas></div>' : '<div class="empty">Weekly averages will appear after two days of measurements.</div>'}`;

const drawChart = (canvas, averageKey, minKey, maxKey, color, suffix) => {
  const ratio = window.devicePixelRatio || 1;
  const width = Math.max(220, canvas.clientWidth);
  const height = 120;
  canvas.width = width * ratio; canvas.height = height * ratio;
  const draw = canvas.getContext('2d'); draw.scale(ratio, ratio);
  const padding = { left: 34, right: 8, top: 10, bottom: 24 };
  const values = days.flatMap(day => [day[minKey], day[maxKey]]);
  let low = Math.floor(Math.min(...values) - 1); let high = Math.ceil(Math.max(...values) + 1);
  if (low === high) high += 1;
  const x = index => padding.left + index * (width - padding.left - padding.right) / (days.length - 1);
  const y = value => padding.top + (high - value) * (height - padding.top - padding.bottom) / (high - low);
  draw.font = '10px sans-serif'; draw.fillStyle = '#98A6B8'; draw.strokeStyle = '#36414E'; draw.lineWidth = 1;
  [0, 0.5, 1].forEach(step => { const value = high - (high - low) * step; const position = y(value); draw.beginPath(); draw.moveTo(padding.left, position); draw.lineTo(width - padding.right, position); draw.stroke(); draw.fillText(`${Math.round(value)}${suffix}`, 3, position + 4); });
  draw.fillStyle = color; draw.globalAlpha = 0.13; draw.beginPath();
  days.forEach((day, index) => index ? draw.lineTo(x(index), y(day[maxKey])) : draw.moveTo(x(index), y(day[maxKey])));
  [...days].reverse().forEach((day, reverseIndex) => { const index = days.length - reverseIndex - 1; draw.lineTo(x(index), y(day[minKey])); });
  draw.closePath(); draw.fill(); draw.globalAlpha = 1; draw.strokeStyle = color; draw.lineWidth = 2.5; draw.beginPath();
  days.forEach((day, index) => index ? draw.lineTo(x(index), y(day[averageKey])) : draw.moveTo(x(index), y(day[averageKey]))); draw.stroke();
  days.forEach((day, index) => { draw.fillStyle = color; draw.beginPath(); draw.arc(x(index), y(day[averageKey]), 2.5, 0, Math.PI * 2); draw.fill(); draw.fillStyle = '#98A6B8'; draw.textAlign = 'center'; draw.fillText(formatDay(day.date), x(index), height - 7); });
};
if (days.length > 1) {
  drawChart(content.querySelector('[data-chart="temperature"]'), 'tempAvg', 'tempMin', 'tempMax', '#FF796B', ' C');
  drawChart(content.querySelector('[data-chart="humidity"]'), 'humidAvg', 'humidMin', 'humidMax', '#45B9DE', '%');
}
</script>
