; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
HCS_VERSION = 2.1


[env:esp32-s3-devkitc-1]
platform = espressif32@6.4.0
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_build.partitions = partitions_hcs.csv
framework = arduino
build_unflags = -std=gnu++11
build_flags = 
	-w
	-std=gnu++2a 
	-DDEVELOPER="JakubBecmer"
	-DHCS_VERSION="${env.HCS_VERSION}"
	-DSUPPORT_NOTIFICATION
lib_deps = 
	paulstoffregen/Time@^1.6.1
	arduino-libraries/NTPClient@^3.2.1
	rc-switch
lib_ignore = lvgl, GFX Library for Arduino, TAMC_GT911
board_build.psram = enabled
extra_scripts =
	pre:extra/generate_build_info.py
	pre:extra/generate_device_registry.py
	pre:extra/generate_device_config_widgets.py




[env:esp32-s3-supermini]
platform = espressif32@6.4.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 921600
monitor_speed = 115200
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = partitions_4mb.csv
build_unflags = -std=gnu++11
build_flags = 
	-w
	-std=gnu++2a 
	-DDEVELOPER="JakubBecmer"
	-DHCS_VERSION="${env.HCS_VERSION}"
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DSUPERMINI
lib_deps = 
	paulstoffregen/Time@^1.6.1
	arduino-libraries/NTPClient@^3.2.1
	rc-switch
lib_ignore = lvgl, GFX Library for Arduino, TAMC_GT911
board_build.psram = disabled
board_build.esp32s3_psram = disabled
extra_scripts =
	pre:extra/generate_build_info.py
	pre:extra/generate_device_registry.py
	pre:extra/generate_device_config_widgets.py



; -DSUPPORT_NOTIFICATION

[env:DisplayS34inch]
platform = espressif32@6.4.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.psram = enabled
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = partitions_display_s3_4inch.csv
board_upload.maximum_size = 16777216
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
	-w
	-std=gnu++2a
	-DDEVELOPER="JakubBecmer"
	-DHCS_VERSION="${env.HCS_VERSION}"
	-DBOARD_HAS_PSRAM
	-DLV_CONF_INCLUDE_SIMPLE
	-DHCS_TARGET_DISPLAY_S3_4INCH
	-DHCS_DISPLAY_ROLE_CLIENT
	-mfix-esp32-psram-cache-issue
lib_deps =
	paulstoffregen/Time@^1.6.1
	arduino-libraries/NTPClient@^3.2.1
	rc-switch
	bblanchon/ArduinoJson@^7.2.0
	Regexp
	adafruit/DHT sensor library@^1.4.6
	lvgl@^8.4.0
	moononournation/GFX Library for Arduino@1.5.6
	https://github.com/tamctec/gt911-arduino
extra_scripts =
	pre:extra/generate_build_info.py
	pre:extra/generate_device_registry.py
	pre:extra/generate_device_config_widgets.py
